# Postfix と Dovecot はコンテナではなく VM で直接動かすので、ここで開ける
# 80 は Let's Encrypt の HTTP-01（certbot が取得と更新のときだけ待ち受ける）
iptables_tcp_ports: [25, 80, 465, 587, 993]

# メール（roles/mail）
mail_domain: alphajinsei.com
mail_hostname: mail.alphajinsei.com
# Let's Encrypt のアカウントの連絡先
mail_acme_email: alphajinsei@gmail.com
# メールボックスを持つユーザー（@ の前）。terraform/mail.tf の mail_users と同じものを書く（パスワードを Vault に作る）
mail_users: [alphajinsei]
# 別名 -> ユーザー。postmaster は RFC で必須。dmarc は DMARC のレポートの受け口（8-4）
mail_aliases:
  postmaster: alphajinsei
  abuse: alphajinsei
  dmarc: alphajinsei

# 外への配送の中継先（Email Delivery）。ホスト名と SMTP のユーザー名は Terraform の出力から、パスワードは Vault から
mail_relay: "{{ lookup('ansible.builtin.pipe', 'terraform -chdir=' ~ playbook_dir ~ '/../terraform output -json mail_relay') | from_json }}"

# /srv/mail のバックアップの置き場（terraform/mail.tf の oci_objectstorage_bucket.mail_backup と同じ名前）
mail_backup_bucket: mail-backup
