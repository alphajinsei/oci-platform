# メールサーバー（mail VM）。Postfix が 25番で受け、Dovecot に LMTP で渡して Maildir に保存する。
# メールソフトは Dovecot の IMAP（993番）で読み、465・587番で送る（ログインは Dovecot が確かめる）。
# 外への配送は全部 Email Delivery に中継する

# メールボックスの持ち主。メールのユーザーは Linux のユーザーにしない（virtual）ので、全員分をこの1人が持つ。
# Postfix の virtual_uid_maps / virtual_gid_maps と同じ番号にする（グループを先に作らないと、別の番号になる）
- name: Create vmail group
  ansible.builtin.group:
    name: vmail
    gid: 5000
    system: true

- name: Create vmail user
  ansible.builtin.user:
    name: vmail
    uid: 5000
    group: vmail
    system: true
    home: /srv/mail
    create_home: false
    shell: /usr/sbin/nologin

# メールのデータは /srv/mail にまとめる（あとでブロックボリュームに移すときも、ここをマウントし直すだけ）
- name: Create /srv/mail
  ansible.builtin.file:
    path: /srv/mail
    state: directory
    owner: vmail
    group: vmail
    mode: "0700"

# ---- 証明書：Let's Encrypt（ACME の HTTP-01）。Postfix と Dovecot が同じものを使う ----
# certbot が 80番で一時的に待ち受け、Let's Encrypt からの確認（http://<名前>/.well-known/acme-challenge/...）に答える。
# 更新は certbot のパッケージが入れる systemd のタイマー（1日2回、期限の30日前から更新）。更新したら deploy フックで読み直す
- name: Install certbot
  ansible.builtin.apt:
    name: certbot
    state: present

- name: Get certificate
  ansible.builtin.command: >-
    certbot certonly --standalone --non-interactive --agree-tos
    --email {{ mail_acme_email }} -d {{ mail_hostname }}
  args:
    creates: "/etc/letsencrypt/live/{{ mail_hostname }}/fullchain.pem"

- name: Reload mail services after renewal
  ansible.builtin.copy:
    content: |
      #!/bin/sh
      # Managed by Ansible (roles/mail). certbot runs this after a certificate is renewed.
      systemctl reload postfix dovecot
    dest: /etc/letsencrypt/renewal-hooks/deploy/reload-mail.sh
    mode: "0755"

# ---- Rspamd：受け取ったメールの点数付け（迷惑メールの判定、SPF・DKIM・DMARC の確認） ----
# Postfix が milter（受け取りの途中で別のプログラムに見せる仕組み）として呼ぶ（localhost:11332）。
# 設定はパッケージのものを残し、変えるところだけ local.d/ に書く。画面（localhost:11334）は SSH のトンネルで見る
- name: Install rspamd and redis
  ansible.builtin.apt:
    name: [rspamd, redis-server]
    state: present

- name: Write rspamd settings
  ansible.builtin.template:
    src: "rspamd/{{ item }}.j2"
    dest: "/etc/rspamd/local.d/{{ item }}"
    mode: "0644"
  loop: [actions.conf, redis.conf, milter_headers.conf]
  notify: Restart rspamd

- name: Start rspamd and redis
  ansible.builtin.service:
    name: "{{ item }}"
    state: started
    enabled: true
  loop: [redis-server, rspamd]

# ---- Postfix ----
# インストールのときの質問（どんな種類のメールサーバーか）に先に答えておく。main.cf は下で丸ごと書き換える
- name: Preseed postfix
  ansible.builtin.debconf:
    name: postfix
    question: "{{ item.q }}"
    value: "{{ item.v }}"
    vtype: "{{ item.t }}"
  loop:
    - { q: postfix/main_mailer_type, v: "Internet Site", t: select }
    - { q: postfix/mailname, v: "{{ mail_hostname }}", t: string }

- name: Install postfix
  ansible.builtin.apt:
    name: [postfix]
    state: present

- name: Write main.cf
  ansible.builtin.template:
    src: main.cf.j2
    dest: /etc/postfix/main.cf
    mode: "0644"
  notify: Reload postfix

- name: Write master.cf
  ansible.builtin.template:
    src: master.cf.j2
    dest: /etc/postfix/master.cf
    mode: "0644"
  notify: Restart postfix

# 宛先の一覧（virtual_mailbox_maps）、別名（virtual_alias_maps）、名乗ってよい差出人（smtpd_sender_login_maps）。
# postmap で Postfix が引ける形（.db）にする
- name: Write mailbox, alias and sender maps
  ansible.builtin.template:
    src: "{{ item }}.j2"
    dest: "/etc/postfix/{{ item }}"
    mode: "0644"
  loop: [vmailbox, virtual, sender_login]
  notify: Postmap and reload postfix

# 中継先（Email Delivery）のパスワード。Vault から読み、root だけが読めるファイルにする
- name: Read relay password from Vault
  ansible.builtin.command: platform-secret {{ mail_relay.password_name }}
  register: mail_relay_password
  changed_when: false
  no_log: true

- name: Write relay credentials
  ansible.builtin.template:
    src: sasl_passwd.j2
    dest: /etc/postfix/sasl_passwd
    mode: "0600"
  no_log: true
  notify: Postmap and reload postfix

- name: Start postfix
  ansible.builtin.service:
    name: postfix
    state: started
    enabled: true

# ---- Dovecot：IMAP（993番）、LMTP での保存、パスワードの確認 ----
- name: Install dovecot
  ansible.builtin.apt:
    name: [dovecot-core, dovecot-imapd, dovecot-lmtpd]
    state: present

# Sieve（受け取ったときの振り分け）。Rspamd が迷惑メールと判定したものを Junk に入れる
- name: Install dovecot sieve
  ansible.builtin.apt:
    name: [dovecot-sieve]
    state: present

- name: Create /etc/dovecot/sieve
  ansible.builtin.file:
    path: /etc/dovecot/sieve
    state: directory
    mode: "0755"

# Dovecot（vmail で動く）は /etc に書けないので、先に root で翻訳しておく（.svbin）
- name: Write spam-to-junk sieve
  ansible.builtin.template:
    src: spam-to-junk.sieve.j2
    dest: /etc/dovecot/sieve/spam-to-junk.sieve
    mode: "0644"
  notify: Compile sieve

# パッケージの設定（conf.d/ を読み込む形）は使わず、1つのファイルに全部書く。Linux のユーザーでのログイン（PAM）も切れる
- name: Write dovecot.conf
  ansible.builtin.template:
    src: dovecot.conf.j2
    dest: /etc/dovecot/dovecot.conf
    mode: "0644"
  notify: Restart dovecot

# パスワードは Vault から読み、ハッシュ（SHA512-CRYPT）にして置く。平文はファイルにも Ansible の出力にも残さない。
# ソルトをユーザーごとに固定して、何度流してもファイルが変わらないようにする
- name: Hash mail passwords from Vault
  ansible.builtin.shell: >-
    set -o pipefail;
    platform-secret mail-{{ item }}-password
    | openssl passwd -6 -salt {{ ((item ~ '@' ~ mail_domain) | hash('sha256'))[:16] }} -stdin
  args:
    executable: /bin/bash
  loop: "{{ mail_users }}"
  register: mail_password_hashes
  changed_when: false
  no_log: true

- name: Write dovecot users
  ansible.builtin.template:
    src: dovecot-users.j2
    dest: /etc/dovecot/users
    owner: root
    group: dovecot
    mode: "0640"
  no_log: true

- name: Start dovecot
  ansible.builtin.service:
    name: dovecot
    state: started
    enabled: true

# ---- fail2ban：ログインの失敗が続く IP を締め出す（465・587・993番） ----
- name: Install fail2ban
  ansible.builtin.apt:
    name: fail2ban
    state: present

- name: Write jail.local
  ansible.builtin.template:
    src: jail.local.j2
    dest: /etc/fail2ban/jail.local
    mode: "0644"
  notify: Restart fail2ban

- name: Start fail2ban
  ansible.builtin.service:
    name: fail2ban
    state: started
    enabled: true

# ---- バックアップ：/srv/mail を週に1回 Object Storage へ（2世代） ----
- name: Install mail-backup
  ansible.builtin.template:
    src: mail-backup.sh.j2
    dest: /usr/local/sbin/mail-backup
    mode: "0755"

- name: Install mail-backup service and timer
  ansible.builtin.template:
    src: "mail-backup.{{ item }}.j2"
    dest: "/etc/systemd/system/mail-backup.{{ item }}"
    mode: "0644"
  loop: [service, timer]
  register: mail_backup_units

- name: Enable mail-backup timer
  ansible.builtin.systemd_service:
    name: mail-backup.timer
    state: started
    enabled: true
    daemon_reload: "{{ mail_backup_units.changed }}"
