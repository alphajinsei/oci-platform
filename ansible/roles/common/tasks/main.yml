- name: Set timezone to Asia/Tokyo
  community.general.timezone:
    name: Asia/Tokyo

- name: Install base packages
  ansible.builtin.apt:
    name: [unattended-upgrades, needrestart, iptables-persistent, jq]
    state: present
    update_cache: true
    cache_valid_time: 3600

# セキュリティの更新だけ毎日自動で入れる。再起動はしない（コンテナを止めないため）。
# Docker 本体も自動では更新しない。再起動と Docker の更新は upgrade.yml で手で流す
- name: Configure unattended-upgrades
  ansible.builtin.copy:
    src: 52unattended-upgrades-local
    dest: /etc/apt/apt.conf.d/52unattended-upgrades-local
    mode: "0644"

# ライブラリの更新のあと、needrestart が Docker を再起動してコンテナを止めないようにする
- name: Keep needrestart away from Docker
  ansible.builtin.copy:
    src: needrestart-docker.conf
    dest: /etc/needrestart/conf.d/docker.conf
    mode: "0644"

# OCI の Ubuntu イメージは、INPUT の最後で 22 番以外を REJECT している。SSH の行の後ろに足す
- name: Open TCP ports in iptables
  ansible.builtin.lineinfile:
    path: /etc/iptables/rules.v4
    insertafter: '--dport 22 -j ACCEPT'
    line: "-A INPUT -p tcp -m state --state NEW -m tcp --dport {{ item }} -j ACCEPT"
  loop: "{{ iptables_tcp_ports }}"
  notify: Reload iptables
