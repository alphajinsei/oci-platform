- name: Create swap file (2GB)
  ansible.builtin.command: fallocate -l 2G /swapfile
  args:
    creates: /swapfile

- name: Set swap file permissions
  ansible.builtin.file:
    path: /swapfile
    mode: "0600"

- name: Format swap file
  ansible.builtin.command: mkswap /swapfile
  changed_when: true
  when: ansible_swaptotal_mb == 0

- name: Enable swap now
  ansible.builtin.command: swapon /swapfile
  changed_when: true
  when: ansible_swaptotal_mb == 0

- name: Enable swap at boot
  ansible.posix.mount:
    src: /swapfile
    path: none
    fstype: swap
    opts: sw
    state: present

- name: Prefer RAM over swap
  ansible.posix.sysctl:
    name: vm.swappiness
    value: "10"
